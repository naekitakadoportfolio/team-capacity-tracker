<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Capacity Tracker · Demo</title><meta name="description" content="Editor capacity, weekly hold board, pipeline output trends and Best Bets">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg1:#EAF4FA;--bg2:#D7EAF5;--ink:#14384E;--mauve:#4F6E80;--cocoa:#1D4C93;--sky:#89CDE7;--card:rgba(255,255,255,.62);--line:rgba(20,56,78,.14);--blush:rgba(137,205,231,.22);--rose:#89CDE7;--ok-bg:#DDF1E4;--ok:#1E5A36;--warn-bg:#FCEBC8;--warn:#7A4E12;--bad-bg:#F8D7DA;--bad:#8A2C3A}
[data-theme=dark]{--bg1:#0B1E2A;--bg2:#14384E;--ink:#E6F2F8;--mauve:#9BB8C8;--card:rgba(20,56,78,.55);--line:rgba(137,205,231,.18);--blush:rgba(137,205,231,.12);--cocoa:#89CDE7;--ok-bg:rgba(46,160,90,.2);--ok:#8FE0AE;--warn-bg:rgba(230,160,40,.2);--warn:#F5C97A;--bad-bg:rgba(220,80,90,.2);--bad:#F5A3AC}
*{box-sizing:border-box}body{margin:0;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.topbar .brand{font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--mauve)}
.hero{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 8px 30px rgba(10,30,45,.08)}
.tag{display:inline-block;background:var(--blush);color:var(--cocoa);font-size:11px;letter-spacing:.14em;font-weight:700;border-radius:6px;padding:4px 10px}
h1{color:var(--ink);font-size:clamp(24px,4vw,34px);margin:10px 0 6px;font-weight:700}.hero p{margin:0;max-width:720px;color:var(--mauve)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(10,30,45,.06)}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mauve);margin:0 0 12px;font-weight:700}
label{font-size:13px;font-weight:600;color:var(--mauve);display:block;margin:10px 0 4px}
select,textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:rgba(255,255,255,.7);color:#14384E}[data-theme=dark] select,[data-theme=dark] textarea,[data-theme=dark] input{background:rgba(255,255,255,.08);color:var(--ink)}
input[type=range],input[type=checkbox]{accent-color:#1D4C93}textarea{min-height:120px;resize:vertical}
button{background:#1D4C93;color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}button:hover{filter:brightness(1.1)}
button.ghost{background:transparent;color:var(--cocoa);border:1px solid var(--line)}
.pill{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin:2px}
.high{background:var(--bad-bg);color:var(--bad)}.medium{background:var(--warn-bg);color:var(--warn)}.low{background:var(--ok-bg);color:var(--ok)}
ul{padding-left:18px;margin:6px 0}li{margin:4px 0}li::marker{color:var(--sky)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mauve);font-weight:600}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:120px;background:var(--blush);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:24px;color:var(--cocoa)}
pre{background:#0B1E2A;color:#CFE8F4;border-radius:10px;padding:12px;font-size:12px;overflow:auto;max-height:320px}
footer{text-align:center;font-size:12px;color:var(--mauve);margin-top:28px}a{color:var(--cocoa)}.muted{color:var(--mauve);font-size:13px}
.hero:after{display:none}
</style><style>
.shell{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:4px}@media(max-width:820px){.shell{grid-template-columns:1fr}}
.side{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:14px;height:fit-content;position:sticky;top:12px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;margin:2px 0}
.side a.on{background:var(--cocoa);color:#fff}.side a:hover:not(.on){background:var(--blush)}
.badge{background:#C0392B;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.who{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:11px;font-weight:700;color:var(--mauve);text-align:center;letter-spacing:.08em}
.day{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:6px;background:rgba(255,255,255,.35);cursor:pointer;font-size:12px;overflow:hidden}
[data-theme=dark] .day{background:rgba(255,255,255,.04)}.day:hover{outline:2px solid var(--sky)}.day.off{opacity:.4}.day.we{background:var(--blush)}.day.today{outline:2px solid var(--cocoa)}.day.sel{background:rgba(29,76,147,.18)}
.ev{border-radius:5px;padding:1px 5px;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.Vacation{background:#1D4C93}.Sick{background:#C27C0E}.Personal{background:#2E8B57}.Protected{background:#6B7A86}.Holiday{background:#89CDE7;color:#14384E}.pending{opacity:.6;border:1px dashed #fff}
.toast{position:fixed;right:18px;bottom:18px;background:var(--cocoa);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;z-index:9;max-width:340px}.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(10,30,45,.45);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}.modal.show{display:flex}.modal .card{max-width:480px;width:100%;background:var(--bg1)}
.row{display:flex;gap:10px}.row>*{flex:1}.legend span{margin-right:10px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.bar{background:var(--blush);border-radius:99px;height:8px;margin-top:4px}.bar div{height:8px;border-radius:99px;background:var(--cocoa)}
</style><style>.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.legend span{margin-right:10px}</style></head><body><div class="wrap">
<div class="topbar"><span class="brand">CAPACITY TRACKER · DEMO</span><span><button class="ghost" style="margin:0;padding:6px 12px" onclick="resetAll()">↺ Reset demo data</button> <button class="ghost" id="themeBtn" style="margin:0;padding:6px 12px" onclick="toggleTheme()">🌙 Dark</button></span></div>
<div class="shell"><nav class="side"><a href="#/overview" data-r="overview">🏠 Overview <span class="badge" data-b="overview"></span></a>
<a href="#/board" data-r="board">🧩 Weekly board <span class="badge" data-b="board"></span></a>
<a href="#/editors" data-r="editors">👥 Editors <span class="badge" data-b="editors"></span></a>
<a href="#/pipelines" data-r="pipelines">📊 Pipeline output <span class="badge" data-b="pipelines"></span></a>
<a href="#/bestbets" data-r="bestbets">🏆 Best Bets <span class="badge" data-b="bestbets"></span></a>
<a href="#/audit" data-r="audit">🧪 Data audit <span class="badge" data-b="audit"></span></a>

<a href="#/activity" data-r="activity">🔔 Activity <span class="badge" data-b="activity"></span></a></nav><main id="view"></main></div>

<footer>Portfolio rebuild by <b>Nae Kitakado</b>, AI Automation Consultant · <a href="https://github.com/naekitakadoportfolio/team-capacity-tracker">Source</a> · <a href="https://www.linkedin.com/in/nae-k-203194265">LinkedIn</a><br>All data is fictional. Changes are saved in your browser only.</footer></div>
<script>
const PIPES=["UGC","Testimonial","Product","Promo"];
function SEED(){return{eds:[{id:1,n:"Ava",cap:8,st:"active",hist:[7,8,6,9,8,7,9,8]},{id:2,n:"Ben",cap:8,st:"active",hist:[5,6,6,5,7,6,5,6]},{id:3,n:"Cara",cap:10,st:"active",hist:[9,9,8,10,9,9,10,9]},{id:4,n:"Dan",cap:8,st:"departed",hist:[6,7,5,0,0,0,0,0]},{id:5,n:"Eli",cap:6,st:"active",hist:[4,5,3,6,5,4,6,5]}],
 holds:[{id:1,t:"Spring hook test",p:"UGC",ed:1,size:2},{id:2,t:"Founder story v2",p:"Testimonial",ed:3,size:3},{id:3,t:"Bundle promo",p:"Promo",ed:3,size:2},{id:4,t:"Feature walkthrough",p:"Product",ed:2,size:2},{id:5,t:"Holiday UGC set",p:"UGC",ed:4,size:3},{id:6,t:"Retarget cutdowns",p:"Promo",ed:null,size:2},{id:7,t:"Review compilation",p:"Testimonial",ed:null,size:1}],
 out:{"Q3 2026":{UGC:120,Testimonial:80,Product:95,Promo:60},"Q4 2026":{UGC:138,Testimonial:72,Product:110,Promo:85}},
 rawFields:["Pipeline: UGC","Pipeline: UGC Remix","Testing Element: Hook","Pipeline: Promo","Pipeline: Product"],
 cfg:{tz:"Asia/Manila",excl:true,win:4,trigger:"07:00"},q:"Q4 2026",nid:8,log:[{t:"Nov 3, 07:00",m:"⏱ Daily snapshot ran at 07:00 Asia/Manila"}]}}
const E=id=>S.eds.find(e=>e.id==id),counted=()=>S.eds.filter(e=>!S.cfg.excl||e.st=="active"),load=id=>S.holds.filter(h=>h.ed==id).reduce((a,h)=>a+h.size,0);
const V={};
V.overview=()=>{const eds=counted(),cap=eds.reduce((a,e)=>a+e.cap,0),ld=eds.reduce((a,e)=>a+load(e.id),0),un=S.holds.filter(h=>!h.ed||E(h.ed).st=="departed");
 return`<div class="hero"><span class="tag">WEEK 45 · 2026</span><h1>Team capacity</h1><p>How much creative capacity the team really has this week, and where open holds should go.</p></div>
 <div class="card" style="margin-top:16px"><div class="kpi"><div><b>${eds.length}</b>editors counted</div><div><b>${cap}</b>weekly capacity</div><div><b>${ld}</b>assigned</div><div><b>${Math.max(0,cap-ld)}</b>open holds</div><div><b>${un.length}</b>holds needing an editor</div></div></div>
 <div class="grid"><div class="card"><h2>Utilisation</h2>${eds.map(e=>{const p=Math.min(100,load(e.id)/e.cap*100);return`<div style="margin:6px 0">${e.n}${e.st=="departed"?' <span class="pill high">departed</span>':""} <span class="muted">${load(e.id)}/${e.cap}</span><div class="bar"><div style="width:${p}%;background:${load(e.id)>e.cap?"#C0392B":""}"></div></div></div>`}).join("")}</div>
 <div class="card"><h2>Needs attention</h2>${un.length?un.map(h=>`<div style="padding:4px 0">⚠️ <b>${esc(h.t)}</b> · ${h.p} · ${h.ed?"assigned to departed editor":"unassigned"}</div>`).join(""):"<p class='muted'>All holds assigned.</p>"}<button onclick="go('board')">Open weekly board</button></div></div>`};
V.board=()=>{const cols=[{id:null,n:"Unassigned",cap:Infinity,st:"active"},...S.eds.filter(e=>e.st=="active"||S.holds.some(h=>h.ed==e.id))];
 return`<div class="card"><h2>Weekly board</h2><p class="muted">Move holds between editors. You'll get a warning if someone goes over capacity.</p><button onclick="holdM()">+ New hold</button></div>
 <div style="display:grid;grid-template-columns:repeat(${cols.length},minmax(170px,1fr));gap:10px;margin-top:12px;overflow:auto">${cols.map(c=>{const hs=S.holds.filter(h=>h.ed==c.id),l=hs.reduce((a,h)=>a+h.size,0);
 return`<div class="card" style="padding:12px"><b>${c.n}</b> ${c.id?`<span class="pill ${l>c.cap?"high":l==c.cap?"medium":"low"}">${l}/${c.cap}</span>`:""}${c.st=="departed"?' <span class="pill high">departed</span>':""}
 ${hs.map(h=>`<div style="border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;font-size:13px"><b>${esc(h.t)}</b><br><span class="muted">${h.p} · size ${h.size}</span><select style="margin-top:6px;padding:4px" onchange="assign(${h.id},this.value)"><option value="">Move to…</option><option value="0">Unassigned</option>${S.eds.filter(e=>e.st=="active").map(e=>`<option value="${e.id}">${e.n} (${load(e.id)}/${e.cap})</option>`).join("")}</select></div>`).join("")||"<p class='muted'>No holds</p>"}</div>`}).join("")}</div>`};
function assign(hid,v){if(v==="")return;const h=S.holds.find(x=>x.id==hid),to=+v||null;if(to){const e=E(to);if(load(to)+h.size>e.cap&&!confirm(`${e.n} would be at ${load(to)+h.size}/${e.cap}. Assign anyway?`))return route()}h.ed=to;L(`🧩 "${h.t}" → ${to?E(to).n:"Unassigned"}`);toast("Hold moved");route()}
function holdM(){openM(`<h2>New hold</h2><label>Title</label><input id="ht"><label>Pipeline</label><select id="hp">${PIPES.map(p=>`<option>${p}</option>`).join("")}</select><label>Size (cards)</label><input type="number" id="hs" value="2" min="1" max="10"><button onclick="addHold()">Create hold</button> <button class="ghost" onclick="closeM()">Cancel</button>`)}
function addHold(){const t=$("ht").value.trim(),s=+$("hs").value;if(t.length<3)return toast("Title needs at least 3 characters");if(!(s>=1&&s<=10))return toast("Size must be 1–10");S.holds.push({id:S.nid++,t,p:$("hp").value,ed:null,size:s});L(`➕ New hold "${t}" (${s})`);closeM();toast("Hold created");route()}
V.editors=()=>`<div class="grid"><div class="card"><h2>Editors</h2><table><tr><th>Name</th><th>Capacity/wk</th><th>Assigned</th><th>Status</th><th></th></tr>${S.eds.map(e=>`<tr><td>${e.n}</td><td><input type="number" value="${e.cap}" min="1" max="20" style="width:70px" onchange="if(this.value<1||this.value>20){toast('Capacity must be 1–20');return route()}E(${e.id}).cap=+this.value;L('⚙️ ${e.n} capacity → '+this.value);route()"></td><td>${load(e.id)}</td><td>${e.st=="active"?'<span class="pill low">active</span>':'<span class="pill high">departed</span>'}</td><td>${e.st=="active"?`<button class="ghost" style="margin:0;padding:5px 10px" onclick="depart(${e.id})">Mark departed</button>`:`<button class="ghost" style="margin:0;padding:5px 10px" onclick="E(${e.id}).st='active';L('↩️ ${e.n} reactivated');route()">Reactivate</button>`}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>Add editor</h2><label>Name</label><input id="en"><label>Weekly capacity</label><input type="number" id="ec" value="8"><button onclick="addEd()">Add editor</button></div></div>`;
function depart(id){const e=E(id),n=S.holds.filter(h=>h.ed==id).length;e.st="departed";S.holds.filter(h=>h.ed==id).forEach(h=>h.ed=null);L(`👋 ${e.n} marked departed · ${n} hold(s) returned to Unassigned`);toast(`${n} hold(s) moved to Unassigned`);route()}
function addEd(){const n=$("en").value.trim(),c=+$("ec").value;if(!n)return toast("Name is required");if(S.eds.some(e=>e.n.toLowerCase()==n.toLowerCase()))return toast("That editor already exists");if(!(c>=1&&c<=20))return toast("Capacity must be 1–20");S.eds.push({id:Math.max(...S.eds.map(e=>e.id))+1,n,cap:c,st:"active",hist:[0,0,0,0,0,0,0,0]});L(`➕ Editor ${n} added (${c}/wk)`);toast("Editor added");route()}
V.pipelines=()=>{const q=S.q,pq=q=="Q4 2026"?"Q3 2026":null,a=S.out[q],max=Math.max(...PIPES.flatMap(p=>[S.out["Q3 2026"][p],S.out["Q4 2026"][p]]));
 const svg=`<svg viewBox="0 0 420 220" width="100%">${PIPES.map((p,i)=>{const x=30+i*100,h3=S.out["Q3 2026"][p]/max*160,h4=S.out["Q4 2026"][p]/max*160;return`<rect x="${x}" y="${180-h3}" width="30" height="${h3}" rx="3" fill="#89CDE7"><title>Q3 ${p}: ${S.out["Q3 2026"][p]}</title></rect><rect x="${x+34}" y="${180-h4}" width="30" height="${h4}" rx="3" fill="#1D4C93"><title>Q4 ${p}: ${S.out["Q4 2026"][p]}</title></rect><text x="${x+32}" y="200" text-anchor="middle" font-size="12" fill="currentColor">${p}</text>`}).join("")}<line x1="20" y1="180" x2="410" y2="180" stroke="#89CDE7"/></svg>`;
 return`<div class="grid"><div class="card"><h2>Output by pipeline</h2><select style="width:auto" onchange="S.q=this.value;route()">${Object.keys(S.out).map(k=>`<option ${k==q?"selected":""}>${k}</option>`).join("")}</select><table style="margin-top:10px"><tr><th>Pipeline</th><th>${q}</th><th>Change</th></tr>${PIPES.map(p=>{const c=pq?Math.round((a[p]-S.out[pq][p])/S.out[pq][p]*100):0;return`<tr><td>${p}</td><td>${a[p]}</td><td>${pq?`<span class="pill ${c>=0?"low":"high"}">${c>=0?"+":""}${c}%</span>`:"—"}</td></tr>`}).join("")}<tr><th>Total</th><th>${PIPES.reduce((s,p)=>s+a[p],0)}</th><td></td></tr></table></div>
 <div class="card"><h2>Quarter vs quarter</h2>${svg}<p class="muted legend"><span><i style="background:#89CDE7"></i>Q3 2026</span><span><i style="background:#1D4C93"></i>Q4 2026</span></p></div></div>`};
V.bestbets=()=>{const w=S.cfg.win,eds=counted().map(e=>({e,avg:e.hist.slice(-w).reduce((a,b)=>a+b,0)/w})).sort((a,b)=>b.avg-a.avg);
 return`<div class="card"><h2>Best Bets · rolling ${w}-week window</h2><input type="range" min="2" max="8" value="${w}" oninput="S.cfg.win=+this.value;route()"><table style="margin-top:10px"><tr><th>Editor</th><th>Avg cards/wk</th><th>Utilisation</th><th>Trend (8 wks)</th></tr>${eds.map(({e,avg},i)=>`<tr><td>${i==0?"🏆 ":""}${e.n}</td><td>${avg.toFixed(1)}</td><td>${Math.round(avg/e.cap*100)}%</td><td><svg viewBox="0 0 80 20" width="80" height="20"><polyline fill="none" stroke="#1D4C93" stroke-width="2" points="${e.hist.map((v,j)=>`${j*11},${18-v/12*16}`).join(" ")}"/></svg></td></tr>`).join("")}</table><p class="muted">Use Best Bets to give urgent holds to editors with a proven recent pace.</p></div>`};
V.audit=()=>{const phantom=S.eds.filter(e=>e.st=="departed"&&(!S.cfg.excl||S.holds.some(h=>h.ed==e.id))),sub=S.rawFields.filter(f=>f.includes("UGC")).length,exact=S.rawFields.filter(f=>f=="Pipeline: UGC").length;
 return`<div class="card"><h2>Data audit & discovery</h2><p class="muted">Feasibility checks that run before trusting the numbers.</p>
 <table><tr><th>Check</th><th>Result</th><th>Fix</th></tr>
 <tr><td>Phantom capacity (departed editors still counted or holding work)</td><td>${phantom.length?`<span class="pill high">${phantom.length} found</span>`:'<span class="pill low">clean</span>'}</td><td>${phantom.length?`<button style="margin:0;padding:5px 10px" onclick="S.cfg.excl=true;S.eds.filter(e=>e.st=='departed').forEach(e=>S.holds.filter(h=>h.ed==e.id).forEach(h=>h.ed=null));L('🧹 Phantom capacity removed');route()">Fix now</button>`:"—"}</td></tr>
 <tr><td>Field matching: "UGC" substring matches ${sub} fields, exact match ${exact}</td><td>${sub>exact?`<span class="pill high">over-counting</span>`:'<span class="pill low">ok</span>'}</td><td><span class="muted">Uses exact match</span></td></tr>
 <tr><td>Trigger timezone</td><td>${S.cfg.tz=="Asia/Manila"?'<span class="pill low">matches team</span>':`<span class="pill medium">${S.cfg.tz}</span>`}</td><td><button class="ghost" style="margin:0;padding:5px 10px" onclick="go('settings')">Settings</button></td></tr></table>
 <h2 style="margin-top:14px">Raw pipeline fields</h2>${S.rawFields.map(f=>`<span class="pill ${f=="Pipeline: UGC"?"low":"medium"}">${f}</span>`).join("")}</div>`};
V.settings=()=>`<div class="card"><h2>Settings</h2><label>Snapshot timezone</label><select onchange="S.cfg.tz=this.value;L('⚙️ Timezone → '+this.value);toast('Timezone saved');route()">${["Asia/Manila","America/New_York","UTC"].map(z=>`<option ${z==S.cfg.tz?"selected":""}>${z}</option>`).join("")}</select>
 <label>Daily snapshot time</label><input type="time" value="${S.cfg.trigger}" onchange="S.cfg.trigger=this.value;L('⏱ Snapshot time → '+this.value);toast('Saved')">
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${S.cfg.excl?"checked":""} onchange="S.cfg.excl=this.checked;L('⚙️ Exclude departed editors: '+this.checked);route()"> Exclude departed editors from capacity</label>
 <label>Default Best Bets window (weeks)</label><input type="number" min="2" max="8" value="${S.cfg.win}" onchange="if(this.value<2||this.value>8)return toast('Window must be 2–8');S.cfg.win=+this.value;toast('Saved')"></div>`;
V.activity=()=>`<div class="card"><h2>Activity</h2>${S.log.map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted">${l.t}</span> · ${l.m}</div>`).join("")}</div>`;
function badge(r){if(r=="board"){const n=S.holds.filter(h=>!h.ed||E(h.ed).st=="departed").length;return n||""}if(r=="audit"){return S.eds.some(e=>e.st=="departed"&&S.holds.some(h=>h.ed==e.id))?"!":""}return""}


const $=i=>document.getElementById(i);const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const KEY="capDemo";let S;try{S=JSON.parse(localStorage.getItem(KEY))||SEED()}catch(e){S=SEED()}if(!S.log)S.log=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$("toast");t.innerHTML=m;t.classList.add("show");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("show"),3000)}
function L(m){S.log.unshift({t:new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}),m});if(S.log.length>200)S.log.length=200}
function openM(h){$("mbody").innerHTML=h;$("modal").classList.add("show")}function closeM(){$("modal").classList.remove("show")}
function go(r){location.hash="#/"+r}
function route(){const r=(location.hash.replace("#/","").split("?")[0]||Object.keys(V)[0]);document.querySelectorAll(".side a").forEach(a=>a.classList.toggle("on",a.dataset.r==r));
 try{$("view").innerHTML=(V[r]||V[Object.keys(V)[0]])()}catch(e){console.error(e);$("view").innerHTML='<div class="card"><h2>Something went wrong</h2><p class="muted">'+esc(e.message)+'</p></div>'}
 document.querySelectorAll("[data-b]").forEach(b=>{const v=typeof badge=="function"?badge(b.dataset.b):"";b.textContent=v||"";b.style.display=v?"":"none"});
 if(typeof onRoute=="function")onRoute(r);save()}
function resetAll(){S=SEED();S.log=S.log||[];save();toast("Demo data reset");route()}
function toggleTheme(){const h=document.documentElement,n=h.dataset.theme=="dark"?"light":"dark";h.dataset.theme=n;try{localStorage.setItem("demoTheme",n)}catch(e){}$("themeBtn").textContent=n=="dark"?"☀️ Light":"🌙 Dark"}
try{const t=localStorage.getItem("demoTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;$("themeBtn").textContent=t=="dark"?"☀️ Light":"🌙 Dark"}catch(e){}
addEventListener("hashchange",route);addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});route();

</script></body></html>
